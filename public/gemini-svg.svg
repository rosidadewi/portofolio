<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2">
        <animate attributeName="stop-color" values="#8A2BE2;#00F2FE;#4FACFE;#8A2BE2" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#00FE87;#8A2BE2;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .letter {
      font-family: 'Inter', 'Montserrat', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 190px;
      fill: url(#rduGrad);
      letter-spacing: -5px;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.3));
    }
    
    .pulse-ring {
      fill: none;
      stroke: url(#rduGrad);
      stroke-width: 8;
      transform-origin: center;
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0% { transform: scale(0.85); opacity: 0.3; }
      50% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(0.85); opacity: 0.3; }
    }
  </style>

  <circle class="pulse-ring" cx="256" cy="256" r="210" />

  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" class="letter">RDU</text>
</svg>
